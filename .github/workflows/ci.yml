name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets "Update visual snapshots" (or you, from the Actions tab) start CI on the latest main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as update-snapshots.yml, so screenshots render identically.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Recommended by Playwright: Chrome needs more shared memory than Docker's default 64 MB.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Generate share images (Open Graph) from the built pages
        run: npm run build && npm run og
      - name: Run Playwright (E2E, accessibility, visual, SEO, API unit tests)
        run: npm test
      - name: Build the QA report and check Lighthouse budgets
        run: npm run qa:report
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          # Both paths keep their place in the repo when downloaded into the deploy job.
          path: |
            src/data/qa-report.json
            public/og/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    # Only green builds of main are deployed.
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'rakibul-portfolio' }}
    steps:
      - name: Skip if Cloudflare is not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable deploys."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: site-data
          path: .
      - name: Build with the fresh QA report and share images
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - name: Deploy to Cloudflare Pages (static site + functions/)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
