name: Update visual snapshots

# Run manually from the Actions tab after an intentional design change.
on:
  workflow_dispatch:

permissions:
  contents: write
  # To start a fresh CI run once the new baselines are pushed.
  actions: write

# Only one snapshot update at a time; a second click waits for the first.
concurrency:
  group: update-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest commit on the branch, not the one from when the run was queued.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate baselines
        run: npx playwright test tests/visual.spec.ts --update-snapshots=all
      - name: Commit new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "No snapshot changes" && exit 0
          git commit -m "test: update visual snapshots [skip ci]"
          # main may have moved while the tests ran. Rebase onto it, and if both sides
          # touched the same baseline images, keep the ones this run just generated.
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push
      - name: Start CI on the updated main
        # Commits pushed with GITHUB_TOKEN don't trigger workflows, but a dispatch does.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          node -e '
            const url = `https://api.github.com/repos/${process.env.REPO}/actions/workflows/ci.yml/dispatches`;
            fetch(url, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
              body: JSON.stringify({ ref: process.env.REF }),
            }).then(async (r) => {
              if (r.status !== 204) { console.error(r.status, await r.text()); process.exit(1); }
              console.log(`Started CI on ${process.env.REF}.`);
            });
          '
