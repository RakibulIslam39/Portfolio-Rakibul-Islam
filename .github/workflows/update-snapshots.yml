name: Update visual snapshots

# Run manually from the Actions tab after an intentional design change.
on:
  workflow_dispatch:

permissions:
  contents: write

# Only one snapshot update at a time; a second click waits for the first.
concurrency:
  group: update-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate baselines
        run: npx playwright test tests/visual.spec.ts --update-snapshots=all
      - name: Commit new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "No snapshot changes" && exit 0
          git commit -m "test: update visual snapshots [skip ci]"
          # main may have moved while the tests ran; rebase onto it before pushing.
          git pull --rebase origin main
          git push
